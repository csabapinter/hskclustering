[package]
name = "hskclustering"
version = "0.1.0"
edition = "2021"

[dependencies]
# Graph library that supports undirected graphs, weighted edges, and GraphML I/O.
# We pin to the doc'd version to avoid API drift.
graphrs = { version = "0.11.13" }

# Simple CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Ergonomic error handling
anyhow = "1.0"
ndarray = "0.15"
linfa = { version = "0.7", default-features = false, features = ["serde"] }
linfa-reduction = { version = "0.7", default-features = false }
