[package]
name = "hskclustering"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[dependencies]
# Graph algorithms, including Leiden community detection.
graphrs = "0.12.0"

# Simple CLI argument parsing
clap = { version = "4.6.7", features = ["derive"] }

# Ergonomic error handling
anyhow = "1.0.104"
# Linfa 0.8.1 uses ndarray 0.16; 0.17 has incompatible array types.
ndarray = "0.16.1"
linfa = { version = "0.8.1", default-features = false }
linfa-reduction = { version = "0.8.1", default-features = false }
linfa-clustering = { version = "0.8.1", default-features = false, features = ["serde"] }
# Already used by Linfa; exact symmetric PCA decomposition without BLAS.
linfa-linalg = { version = "0.2.1", default-features = false }
rand = "0.8.8"
rand_xoshiro = "0.6.0"
serde = { version = "1.0", features = ["derive"] }
# Frozen manifest/source hashes require f64 values to survive JSON readback exactly.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"

# Streaming, escaped output and atomic file replacement.
csv = "1.4.0"
quick-xml = "0.42.0"
tempfile = "3.27.0"
rayon = "1.12.0"
libc = "0.2"

[patch.crates-io]
# Upstream Leiden overflows its refinement sampling weights on the HSK 1–9 graph.
# This 0.12.0 source copy contains only the numerical fix documented alongside it.
graphrs = { path = "vendor/graphrs-0.12.0" }
# Stable GMM log-sum-exp and a likelihood accessor; see vendor/README.md.
linfa-clustering = { path = "vendor/linfa-clustering-0.8.1" }
